plugins {
    id 'com.android.application'
}

// Version comes from the release tag in CI (v1.2.3 → 1.2.3); local builds use the defaults below.
def appVersionName = System.getenv('VERSION_NAME') ?: '2.0.0'
def appVersionCode = (System.getenv('VERSION_CODE') ?: '2') as Integer

// Release signing is read from the environment, so no key ever lives in the repository.
// Without these variables the release build falls back to the debug key (installable, not for stores).
def keystoreFile = System.getenv('KEYSTORE_FILE')
def hasReleaseKey = keystoreFile != null && file(keystoreFile).exists()

android {
    namespace 'com.insta4dl.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.insta4dl.app'
        minSdk 29
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity launcher, splash, share target, notification delegation and WebView fallback.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
