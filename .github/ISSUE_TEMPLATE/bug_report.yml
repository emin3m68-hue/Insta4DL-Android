name: Bug report
description: Something in the Android app doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Problems with a specific Instagram link
        usually come from the website – please try the same link on https://www.insta4dl.com/ first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0.0
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 14
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Downloading / saving files
        - Share → Insta4DL
        - Paste button
        - Loading the website
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra details
