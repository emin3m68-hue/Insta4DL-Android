name: Build Insta4DL APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Validate Android project
        run: |
          test -f settings.gradle || { echo "ERROR: settings.gradle is missing"; exit 1; }
          test -f app/build.gradle || { echo "ERROR: app/build.gradle is missing. Upload the complete app folder to the root of this repository."; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "ERROR: AndroidManifest.xml is missing. Upload the complete app folder."; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo "ERROR: Android API 35 not installed on runner"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "ERROR: Android build-tools 35.0.0 not installed on runner"; exit 1; }
          echo "Android SDK API 35 ready."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Insta4DL-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
